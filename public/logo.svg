<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Soft glow/shadow effect matching shadow-indigo-500/20 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container Box: w-12 h-12 bg-indigo-600 rounded-2xl (scaled to viewBox coordinates) -->
  <rect x="10" y="10" width="80" height="80" rx="24" ry="24" fill="#4f46e5" filter="url(#shadow)"/>

  <!-- Letter R: text-white font-black text-2xl -->
  <text x="50" y="66" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="46" 
        font-weight="900" 
        fill="#ffffff" 
        text-anchor="middle">R</text>
</svg>
